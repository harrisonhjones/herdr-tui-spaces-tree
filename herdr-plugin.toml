id = "harrisonhjones.herdr-tui-spaces-tree"
name = "Herdr Spaces Tree"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Show the Spaces sidebar as a group -> workspace tree (\"group/name\" labels) with a strip of each workspace's tabs marked by agent state, by writing workspace metadata tokens ($sp_group, $sp_<status>)."
platforms = ["linux", "macos", "windows"]

# Every event runs the same idempotent full reconcile (spaces-tree.js); the event
# name is informational. Runs are serialized with a lock + dirty flag. Tab renames
# are not subscribed: the Spaces rows do not show tab labels.

[[startup]]
command = ["node", "spaces-tree.js", "startup"]

[[events]]
on = "pane.closed"
command = ["node", "spaces-tree.js", "pane.closed"]

[[events]]
on = "pane.exited"
command = ["node", "spaces-tree.js", "pane.exited"]

[[events]]
on = "pane.moved"
command = ["node", "spaces-tree.js", "pane.moved"]

[[events]]
on = "pane.agent_detected"
command = ["node", "spaces-tree.js", "pane.agent_detected"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "spaces-tree.js", "pane.agent_status_changed"]

[[events]]
on = "tab.created"
command = ["node", "spaces-tree.js", "tab.created"]

[[events]]
on = "tab.closed"
command = ["node", "spaces-tree.js", "tab.closed"]

[[events]]
on = "tab.moved"
command = ["node", "spaces-tree.js", "tab.moved"]

[[events]]
on = "workspace.created"
command = ["node", "spaces-tree.js", "workspace.created"]

[[events]]
on = "workspace.closed"
command = ["node", "spaces-tree.js", "workspace.closed"]

[[events]]
on = "workspace.renamed"
command = ["node", "spaces-tree.js", "workspace.renamed"]

[[events]]
on = "workspace.moved"
command = ["node", "spaces-tree.js", "workspace.moved"]

[[events]]
on = "workspace.reordered"
command = ["node", "spaces-tree.js", "workspace.reordered"]

# herdr plugin action invoke harrisonhjones.herdr-tui-spaces-tree.refresh
[[actions]]
id = "refresh"
title = "Refresh spaces tree"
contexts = ["global"]
command = ["node", "spaces-tree.js", "refresh"]

# Remove every token this plugin wrote.
[[actions]]
id = "clear"
title = "Clear spaces tree tokens"
contexts = ["global"]
command = ["node", "spaces-tree.js", "clear"]

# Print the tree it would write, without changing anything.
[[actions]]
id = "doctor"
title = "Print spaces tree (no changes)"
contexts = ["global"]
command = ["node", "spaces-tree.js", "doctor"]

# Temporarily show fake groups, workspaces and tab strips.
[[actions]]
id = "demo"
title = "Demo: show fake spaces"
contexts = ["global"]
command = ["node", "spaces-tree.js", "demo"]

[[actions]]
id = "demo-off"
title = "Demo off: back to real spaces"
contexts = ["global"]
command = ["node", "spaces-tree.js", "demo-off"]
